[package]
name = "expr-solver-bin"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Command-line interface for the expr-solver library"
license = "MIT"

[[bin]]
name = "expr-solver"
path = "src/main.rs"

[dependencies]
expr-solver-lib = { path = "../lib" }
clap = { version = "4.0", features = ["derive"] }
rust_decimal = { workspace = true }
